name: Unsigned Beta

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Prerelease version without the v prefix"
        required: true
        default: "0.1.0-beta.1"
        type: string
      publish:
        description: "Create the public GitHub prerelease"
        required: true
        default: "false"
        type: boolean

permissions:
  contents: write

concurrency:
  group: unsigned-beta-${{ github.ref_name }}
  cancel-in-progress: false

env:
  APP_NAME: "Atoll Island"
  PROJECT: DynamicIsland.xcodeproj
  SCHEME: DynamicIsland
  UNSIGNED_ENTITLEMENTS: ${{ github.workspace }}/DynamicIsland/UnsignedRelease.entitlements
  VERSION: ${{ inputs.version }}

jobs:
  build:
    name: Build explicit unsigned beta
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Validate release request
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            echo "::error::Version must match X.Y.Z-beta.N"
            exit 1
          fi
          if [ "${{ inputs.publish }}" = "true" ] && [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::error::Public prereleases may be created only from main"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Download Metal toolchain
        run: |
          sudo xcodebuild -runFirstLaunch || true
          MAJOR=$(sw_vers -productVersion | cut -d. -f1)
          if [ "$MAJOR" -ge 26 ] && ! xcrun -f metal >/dev/null 2>&1; then
            sudo xcodebuild -downloadComponent MetalToolchain
          fi

      - name: Run tracked regression contracts
        run: |
          python3 -m unittest \
            tests.test_atoll_island_identity \
            tests.test_privacy_configuration \
            tests.test_timer_lifecycle \
            tests.test_code_island_package_boundary \
            tests.test_code_island_phase_two_contracts \
            tests.test_code_island_phase_three_activity \
            tests.test_code_island_phase_three_dashboard \
            tests.test_code_island_phase_three_settings \
            tests.test_code_island_phase_four_contracts \
            tests.test_code_island_phase_six_presentation \
            tests.test_code_island_phase_seven_release \
            tests.test_code_island_phase_seven_bundle
          CODEISLAND_REQUIRE_LIVE_SOCKET=1 \
            python3 -m unittest tests.test_code_island_phase_five_contracts
          swift test --package-path Packages/CodeIsland

      - name: Build release app with ad-hoc signing
        run: |
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "platform=macOS,arch=arm64" \
            -derivedDataPath "$RUNNER_TEMP/AtollIslandDerivedData" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            CODE_SIGN_ENTITLEMENTS="$UNSIGNED_ENTITLEMENTS" \
            DEVELOPMENT_TEAM=

          APP_PATH="$RUNNER_TEMP/AtollIslandDerivedData/Build/Products/Release/${APP_NAME}.app"
          test -d "$APP_PATH"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Normalize and verify ad-hoc signatures
        run: |
          codesign --force --deep --sign - --options runtime "$APP_PATH"
          codesign --force --sign - --options runtime \
            --entitlements "$UNSIGNED_ENTITLEMENTS" \
            "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign --verify --strict --verbose=2 \
            "$APP_PATH/Contents/Helpers/codeisland-bridge"
          scripts/verify-code-island-bundle.sh "$APP_PATH"

      - name: Package unsigned DMG and checksum
        run: |
          DMG_NAME="Atoll-Island-${VERSION}-UNSIGNED.dmg"
          STAGING="$RUNNER_TEMP/AtollIslandDmgRoot"
          mkdir -p "$STAGING" build
          ditto "$APP_PATH" "$STAGING/${APP_NAME}.app"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create \
            -volname "Atoll Island ${VERSION} UNSIGNED" \
            -srcfolder "$STAGING" \
            -ov \
            -format UDZO \
            "build/$DMG_NAME"
          cd build
          shasum -a 256 "$DMG_NAME" > "$DMG_NAME.sha256"

      - name: Upload unsigned beta artifact
        uses: actions/upload-artifact@v4
        with:
          name: Atoll-Island-${{ inputs.version }}-UNSIGNED
          path: |
            build/Atoll-Island-${{ inputs.version }}-UNSIGNED.dmg
            build/Atoll-Island-${{ inputs.version }}-UNSIGNED.dmg.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Create public GitHub prerelease
        if: ${{ inputs.publish == true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION}"
          DMG_PATH="build/Atoll-Island-${VERSION}-UNSIGNED.dmg"
          CHECKSUM_PATH="${DMG_PATH}.sha256"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Atoll Island unsigned beta ${VERSION}"
          git push origin "$TAG"
          gh release create "$TAG" \
            --title "Atoll Island ${VERSION} (Unsigned Beta)" \
            --notes-file docs/unsigned-beta-release.md \
            --prerelease \
            "$DMG_PATH" \
            "$CHECKSUM_PATH"
